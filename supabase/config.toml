
[functions.send-application-emails]
enabled = true
# User JWT and submitted-application ownership are checked inside the handler.
verify_jwt = false
import_map = "./functions/send-application-emails/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-application-emails/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-application-emails/*.html" ]

